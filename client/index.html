<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <span class="status-indicator online" id="status-dot"></span>
            <div class="header-info">
                <h2>Anonymous Chat</h2>
                <p id="status-text">Connecting to server...</p>
            </div>
        </header>

        <main class="chat-messages" id="messages-container">
            <div class="system-message">Welcome! Looking for a stranger...</div>
        </main>

        <footer class="chat-input-area">
            <button id="skip-btn" class="btn-skip" type="button">Skip</button>
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" class="btn-send" type="button">Send</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
